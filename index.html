<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Barlow+Semi+Condensed:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 히어로 배경은 관리자(home_content.hero_bg)에서 바뀔 수 있어 고정 preload 를 하지 않는다 -->
    <meta name="naver-site-verification" content="80548070f79317b42e190d28930cb6e207ae5039" />
    <!-- 페이지별 title/description/og/twitter/canonical 은 각 페이지의 Seo(Head)가 주입 -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="골드럭와인 GOLDLUCKWINE">
    <meta property="og:locale" content="ko_KR">
    <!-- og:image 크기는 페이지마다 다르다(상세는 세로 보틀) — 전역 고정 메타는 두지 않는다 -->
    <meta name="twitter:card" content="summary_large_image">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "골드럭와인",
      "alternateName": "GOLDLUCKWINE",
      "url": "https://goldluckwine.com/",
      "logo": "https://goldluckwine.com/goldluckwine-logo.png",
      "description": "골드럭와인은 슈냉 블랑 중심의 깨끗하고 우아한 내추럴 와인을 소개하는 와인 수입사입니다."
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
